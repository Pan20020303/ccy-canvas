<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent bridge · 会话检视</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #14171c;
        --panel-2: #1a1e25;
        --line: #262b33;
        --fg: #e6e9ef;
        --fg-dim: #9aa4b2;
        --fg-faint: #6b7480;
        --accent: #7dd3fc;
        --think: #8b9dc3;
        --tool: #7ee2a8;
        --canvas: #f5c56b;
        --err: #ff7b72;
        --ok: #4ade80;
        --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font: 13px/1.6 var(--mono);
        height: 100vh; display: flex; flex-direction: column;
      }
      header {
        padding: 10px 16px; border-bottom: 1px solid var(--line);
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        background: var(--panel);
      }
      header h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: .3px; }
      .muted { color: var(--fg-dim); }
      .faint { color: var(--fg-faint); }
      .pill {
        padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line);
        font-size: 11px; color: var(--fg-dim); background: var(--panel-2);
      }
      .pill.ok { color: var(--ok); border-color: #1f4630; }
      .pill.err { color: var(--err); border-color: #4a2220; }
      .pill.warn { color: var(--canvas); border-color: #4a3c1c; }
      main { flex: 1; display: flex; min-height: 0; }
      aside {
        width: 320px; min-width: 240px; border-right: 1px solid var(--line);
        overflow: auto; background: var(--panel);
      }
      aside .job {
        padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer;
      }
      aside .job:hover { background: var(--panel-2); }
      aside .job.active { background: #1d2530; box-shadow: inset 2px 0 0 var(--accent); }
      aside .job .top { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
      aside .job .conv { font-size: 11px; color: var(--fg-faint); margin-top: 2px; word-break: break-all; }
      aside .job .msg { color: var(--fg-dim); font-size: 11px; margin-top: 4px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      section.detail { flex: 1; overflow: auto; padding: 16px 20px 60px; min-width: 0; }
      .summary { display: flex; gap: 18px; flex-wrap: wrap; padding: 10px 12px; margin-bottom: 14px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
      .summary div { font-size: 12px; }
      .summary b { color: var(--fg); font-weight: 600; }
      .summary span { color: var(--fg-dim); }
      .step { margin: 0 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
      .step > .head {
        display: flex; align-items: center; gap: 10px; padding: 7px 12px;
        border-bottom: 1px solid var(--line); font-size: 12px; background: var(--panel-2);
      }
      .step > .body { padding: 10px 12px; white-space: pre-wrap; word-break: break-word; }
      .step.think > .head { color: var(--think); }
      .step.tool > .head { color: var(--tool); }
      .step.canvas > .head { color: var(--canvas); }
      .step.answer > .head { color: var(--accent); }
      .step.notice.error { border-color: #4a2220; }
      .step.notice.error > .head { color: var(--err); }
      .step.usage > .head { color: var(--fg-faint); }
      .step .tag { font-size: 10px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--fg-faint); }
      .step details > summary { cursor: pointer; padding: 10px 12px; color: var(--fg-dim); font-size: 12px; }
      .step details[open] > summary { border-bottom: 1px solid var(--line); }
      .code { margin: 0; padding: 10px 12px; background: #0f1216; border-radius: 6px;
        font-size: 12px; overflow: auto; max-height: 420px; white-space: pre-wrap; word-break: break-word; }
      .kv { display: flex; gap: 8px; align-items: baseline; }
      .kv .k { color: var(--fg-faint); min-width: 68px; }
      .empty { color: var(--fg-faint); padding: 40px 0; text-align: center; }
      .toolbar { display: flex; gap: 8px; align-items: center; margin-left: auto; }
      button {
        background: var(--panel-2); color: var(--fg-dim); border: 1px solid var(--line);
        border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
      }
      button:hover { color: var(--fg); border-color: #39414d; }
      button.on { color: var(--accent); border-color: #2a4a5c; }
      .err-text { color: var(--err); }
      .ok-text { color: var(--ok); }
    </style>
  </head>
  <body>
    <header>
      <h1>agent bridge · 会话检视</h1>
      <span class="pill" id="health">连接中…</span>
      <div class="toolbar">
        <button id="btn-reasoning" class="on">思考块</button>
        <button id="btn-usage">计量</button>
        <button id="btn-raw">原始事件</button>
        <button id="btn-refresh">刷新</button>
      </div>
    </header>
    <main>
      <aside id="jobs"><div class="empty">载入中…</div></aside>
      <section class="detail" id="detail"><div class="empty">从左侧选择一个任务</div></section>
    </main>

    <script src="/inspector/timeline.js"></script>
    <script>
      // 页面只做渲染，合并/配对等呈现逻辑来自共享的 agent-timeline.ts
      // （服务端用 esbuild 现打成 /inspector/timeline.js）。
      const TL = window.CcyTimeline;
      const state = { jobs: [], selected: null, events: [], showReasoning: true, showUsage: false, showRaw: false };

      const $ = (id) => document.getElementById(id);
      const esc = (value) =>
        String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const fmtTime = (ms) => (ms ? new Date(ms).toLocaleString() : "—");
      const fmtDuration = (ms) => (ms == null ? "—" : ms < 1000 ? `${ms}ms` : `${(ms / 1000).toFixed(1)}s`);

      const STATUS_CLASS = { success: "ok", error: "err", interrupted: "warn", cancelled: "warn", running: "", queued: "" };

      async function loadHealth() {
        try {
          const health = await fetch("/health").then((r) => r.json());
          $("health").textContent = `${health.profile} · ${health.model} · 落库 ${health.store ? health.store.jobs + " job / " + health.store.events + " 事件" : "关闭"}`;
          $("health").className = "pill ok";
        } catch {
          $("health").textContent = "桥不可达";
          $("health").className = "pill err";
        }
      }

      async function loadJobs() {
        const data = await fetch("/inspector/jobs?limit=100").then((r) => r.json());
        state.jobs = data.jobs || [];
        renderJobs();
        if (!state.selected && state.jobs.length) selectJob(state.jobs[0].job_id);
      }

      function renderJobs() {
        const host = $("jobs");
        if (!state.jobs.length) {
          host.innerHTML = '<div class="empty">还没有任务记录</div>';
          return;
        }
        host.innerHTML = state.jobs
          .map((job) => {
            const cls = STATUS_CLASS[job.status] ?? "";
            const active = job.job_id === state.selected ? " active" : "";
            return `<div class="job${active}" data-id="${esc(job.job_id)}">
              <div class="top">
                <span class="pill ${cls}">${esc(job.status)}</span>
                <span class="faint">${esc(fmtTime(job.created_at))}</span>
              </div>
              <div class="conv">${esc(job.conversation_id || "(无会话)")}</div>
              <div class="msg">${esc(job.user_message || "")}</div>
              <div class="conv">工具 ${job.tool_calls} · 画布 ${job.canvas_ops} · 事件 ${job.event_count}</div>
            </div>`;
          })
          .join("");
        for (const node of host.querySelectorAll(".job")) {
          node.onclick = () => selectJob(node.dataset.id);
        }
      }

      async function selectJob(jobId) {
        state.selected = jobId;
        renderJobs();
        $("detail").innerHTML = '<div class="empty">载入事件…</div>';
        const text = await fetch(`/api/app/agent-jobs/${encodeURIComponent(jobId)}/events?after=0`).then((r) => r.text());
        state.events = parseSse(text);
        renderDetail();
      }

      /** 解析 SSE 帧为事件数组 —— 与前端 agent-run.ts 的解析规则一致。 */
      function parseSse(text) {
        const events = [];
        for (const frame of text.split("\n\n")) {
          if (!frame.trim() || frame.startsWith(":")) continue;
          let id = 0, type = "", data = "";
          for (const line of frame.split("\n")) {
            if (line.startsWith("id:")) id = Number(line.slice(3).trim()) || 0;
            else if (line.startsWith("event:")) type = line.slice(6).trim();
            else if (line.startsWith("data:")) data += line.slice(5).trim();
          }
          if (!type) continue;
          let parsed = {};
          try { parsed = data ? JSON.parse(data) : {}; } catch { parsed = {}; }
          events.push({ id, type, data: parsed, at: id });
        }
        return events;
      }

      function renderDetail() {
        const job = state.jobs.find((item) => item.job_id === state.selected);
        const { steps, summary } = TL.buildTimeline(state.events);
        const reply = job?.final_reply || TL.finalReplyOf(state.events);

        const head = `<div class="summary">
          <div><span>状态</span> <b class="${summary.status === "success" ? "ok-text" : ""}">${esc(job?.status ?? summary.status)}</b></div>
          <div><span>步数</span> <b>${summary.steps}</b></div>
          <div><span>工具</span> <b>${summary.toolCalls}</b></div>
          <div><span>画布变更</span> <b>${summary.canvasOps}</b></div>
          <div><span>思考/正文片</span> <b>${summary.reasoningChunks}/${summary.messageChunks}</b></div>
          <div><span>token</span> <b>${summary.totalTokens}</b></div>
          <div><span>时长</span> <b>${esc(fmtDuration(summary.durationMs))}</b></div>
          <div><span>会话</span> <b>${esc(job?.conversation_id ?? "—")}</b></div>
        </div>`;

        const body = steps
          .filter((step) => (step.kind === "usage" ? state.showUsage : true))
          .filter((step) => (step.kind === "reasoning" ? state.showReasoning : true))
          .map(renderStep)
          .join("");

        const raw = state.showRaw
          ? `<div class="step"><div class="head">原始事件（${state.events.length} 条）</div>
             <pre class="code">${esc(JSON.stringify(state.events.map((e) => ({ id: e.id, type: e.type, data: e.data })), null, 1))}</pre></div>`
          : "";

        const replyBlock = reply
          ? `<div class="step answer"><div class="head">最终回复</div><div class="body">${esc(reply)}</div></div>`
          : "";

        $("detail").innerHTML = head + body + replyBlock + raw || '<div class="empty">该任务没有事件</div>';
      }

      function renderStep(step) {
        const at = `<span class="faint">#${step.id ?? ""}</span>`;
        switch (step.kind) {
          case "reasoning": {
            const preview = TL.previewText(step.text, 120);
            return `<div class="step think"><details><summary>
              <span class="kv"><span class="k">思考</span>${esc(preview || "(空)")}
              <span class="tag">${step.chunkCount} 片 / ${step.text.length} 字</span></span></summary>
              <div class="body">${esc(step.text)}</div></details></div>`;
          }
          case "message":
            return `<div class="step answer"><div class="head">助手消息 <span class="tag">${step.chunkCount} 片</span></div>
              <div class="body">${esc(step.text)}</div></div>`;
          case "tool": {
            const status = step.ok === null ? '<span class="pill warn">未返回</span>'
              : step.ok ? '<span class="pill ok">ok</span>' : '<span class="pill err">失败</span>';
            const rawName = step.rawName ? ` <span class="tag">${esc(step.rawName)}</span>` : "";
            const payload = step.error
              ? `<div class="err-text">${esc(step.error)}</div>`
              : step.result ? `<pre class="code">${esc(step.result)}</pre>` : "";
            return `<div class="step tool"><div class="head">🔧 ${esc(step.name)}${rawName} ${status}</div>
              <details><summary>参数</summary><pre class="code">${esc(step.arguments || "{}")}</pre></details>
              ${payload ? `<div class="body">${payload}</div>` : ""}</div>`;
          }
          case "canvas":
            return `<div class="step canvas"><div class="head">🎨 ${esc(step.op)}
              <span class="tag">rev ${step.baseRevision ?? "?"} → ${step.revision ?? "?"}</span></div>
              <div class="body">${esc(step.summary)}</div></div>`;
          case "notice":
            return `<div class="step notice ${step.level === "error" ? "error" : ""}">
              <div class="head">${step.level === "error" ? "错误" : "说明"}</div>
              <div class="body">${esc(step.text)}</div></div>`;
          case "usage":
            return `<div class="step usage"><div class="head">计量 <span class="tag">prompt ${step.promptTokens} / completion ${step.completionTokens} / total ${step.totalTokens}</span></div></div>`;
          default:
            return "";
        }
      }

      $("btn-reasoning").onclick = (event) => {
        state.showReasoning = !state.showReasoning;
        event.target.classList.toggle("on", state.showReasoning);
        renderDetail();
      };
      $("btn-usage").onclick = (event) => {
        state.showUsage = !state.showUsage;
        event.target.classList.toggle("on", state.showUsage);
        renderDetail();
      };
      $("btn-raw").onclick = (event) => {
        state.showRaw = !state.showRaw;
        event.target.classList.toggle("on", state.showRaw);
        renderDetail();
      };
      $("btn-refresh").onclick = () => { void loadHealth(); void loadJobs(); };

      void loadHealth();
      void loadJobs();
      setInterval(loadHealth, 5000);
    </script>
  </body>
</html>
